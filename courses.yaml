# courses.yaml: your course reference data (ratings, slopes, par and stroke index), checked by hand.
# Format and a worked example: courses.example.yaml (synthetic; do not copy its club here).
#   golf courses check                 which clubs need an entry (club ids come from your 18Birdies export)
#   golf courses autofill <club_id>    proposes an entry from OpenGolfAPI; confirm it against the scorecard
#   golf courses sync                  loads this file and recomputes the handicap index
#
# Filled in 2026-09-25 from the four clubs in the 18Birdies export. Every tee below says where its
# rating came from (rating_source). checked_on is set only where a second, independent source gave the
# same rating/slope. Public course information only.
#
# The export names the facility, never the course, nine or tee. Two checks tie rounds to a layout:
# - the par checksum: sum of par over the holes played == strokes - score, for every round;
# - the export's own birdie/par/bogey/double counts, recomputed from the hole scores and the par
#   layout below (`golf courses check`: par_pattern_mismatch). A 9-hole round on an 18-hole course is
#   placed on the one nine that passes both (golf.courses.infer_nine); no per-round entries needed.
#
# TODO(Shane): two items below are marked TODO (Butter Brook: the tee, and its 9-hole ratings).
clubs:
  95cbdd20-86ac-11e4-8c28-020000005b00:
    name: Southborough Golf Club
    courses:
      # Source: the club's own scorecard (southboroughgolfclub.com, Scorecard page), which prints
      # 18-hole-equivalent ratings for the nine played twice (White 64.2/113): the 9-hole rating is half
      # the course rating and the same slope. Par 35 = strokes - score on every round. Handicap (SI)
      # 1-9 as printed on the card (OpenGolfAPI's SIs and hole-1/9 yardages are from an older card).
      # 18Birdies' course page has the same card: White (M) 2519 yds, 32.1/113 per nine.
      southborough:
        name: Southborough Golf Club
        holes: 9
        source: club scorecard
        source_ref: http://www.southboroughgolfclub.com/-scorecard
        tees:
        # The tee played (18Birdies' GPS shot tracking records teeName White).
        - name: White
          gender: M
          par: 35
          cr18: 64.2
          slope18: 113
          cr_f9: 32.1
          slope_f9: 113
          rating_source: club scorecard 64.2/113 (18) = 32.1/113 per nine; 18Birdies course page agrees
          checked_on: '2026-09-25'
          is_default: true
          holes:
          - {hole: 1, par: 4, si: 3, yards: 277}
