[player]
# Name as it appears on 18Birdies scorecards (used to pick your row out of group scorecards).
name = "Shane"
timezone = "America/New_York"

[llm]
# Model is a config value on purpose: once a golden set of hand-checked rounds exists,
# `golf eval` compares models and you pick the default.
model = "claude-opus-5"
effort = "high"
# Server-side refusal fallbacks (beta). Harmless for golf content; auto-disabled if rejected.
use_fallbacks = true
max_tokens = 32000

[notes]
# Apple Notes folder to read. Must be under the iCloud account, not "On My iPhone".
apple_notes_folder = "Golf"

[paths]
data_dir = "data"

[watch]
# Folders `golf watch` (the LaunchAgent and `golf serve`) look in for 18Birdies_archive*.json.
# Your files there are only read: never moved, renamed or deleted.
dirs = ["~/Downloads", "~/Library/Mobile Documents/com~apple~CloudDocs/Downloads"]
pattern = "18Birdies_archive*.json"
# Seconds between scans of the foreground `golf watch` loop (golf serve scans every 60 s;
# the LaunchAgent runs when a watched folder changes, and every 30 minutes).
interval_seconds = 300
# The LaunchAgent's own Python (a --copies venv), so macOS folder permissions granted to it
# don't extend to the shared Anaconda interpreter.
python = "~/.venvs/golf-agent/bin/python"

[publish]
# GitHub Pages: https://sharkweekshane.github.io/golf-analytics/ (the gh-pages branch holds only the built site).
# Public: rounds, scores, stats, the unofficial handicap, lessons and note summaries.
# Never public: file paths, screenshots and notebook photos, GPS coordinates, API cost, this Mac's name.
enabled = true         # repo + gh-pages set up 2026-09-25
auto = true            # republish after each new 18Birdies export is imported
remote = "origin"      # git remote of this project (or a URL)
branch = "gh-pages"    # golf publish force-pushes, so it refuses any other branch
site_url = "https://sharkweekshane.github.io/golf-analytics/"
# golf publish only force-pushes to the GitHub repo site_url names (github.com/sharkweekshane/golf-analytics).
allow_any_remote = false
# The Caddie on the public site (caddie/): the address of its Cloudflare Worker relay (worker/ in this repo),
# like "https://golf-caddie.<your-subdomain>.workers.dev". The Worker holds the Meta API key and a passcode;
# neither is ever in the site. Empty: the Caddie page says it isn't connected yet and the dashboard doesn't
# link to it. README.md, "Caddie on GitHub Pages", has the setup.
caddie_worker_url = "https://golf-caddie.golf-caddie-worker.workers.dev"   # deployed 2026-09-27

[caddie]
# The Caddie chat (golf serve -> /caddie, and `golf caddie ask`): Meta's Muse Spark through the Meta Model API.
# The API key is NOT here: it lives in the macOS login Keychain (`golf caddie key` shows the one command).
provider = "muse"
base_url = "https://api.meta.ai/v1"   # the key is sent only to api.meta.ai unless allow_any_base_url = true
allow_any_base_url = false
# Standard tier only. *-contributor models let Meta train on your prompts, so the Caddie refuses them.
# 1.3 at medium effort answered more carefully than 1.1 at low in a side-by-side on real data (2026-09-26),
# at the same per-token price; about 20 s and ~1 cent a question.
model = "muse-spark-1.3"
effort = "medium"         # reasoning effort: minimal | low | medium | high | xhigh
tools = "auto"            # auto (native tool calling, falling back to JSON lookups if Meta refuses it) | native | lookup
max_tool_rounds = 6       # rounds of lookups per question before it must answer
max_output_tokens = 8000  # reasoning tokens count against this too
timeout_seconds = 120     # per request; a timed-out request is never re-sent
