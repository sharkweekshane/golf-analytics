[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-analytics"
version = "0.1.0"
description = "Personal golf analytics: 18Birdies export + screenshot/notebook extraction + Apple Notes lesson timeline"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.8",
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10",
  "pillow-heif>=0.16",
  "dateparser>=1.2",
  "rapidfuzz>=3",
  "pyyaml>=6",
  "tomli>=2; python_version < '3.11'",
  "numpy>=1.26",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
golf = "golf.cli:app"

[tool.setuptools.packages.find]
include = ["golf*"]

[tool.setuptools.package-data]
golf = ["*.sql", "**/*.js", "**/*.md", "**/*.html", "**/*.j2", "**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (costs money; needs ANTHROPIC_API_KEY)"]
addopts = "-m 'not live'"
